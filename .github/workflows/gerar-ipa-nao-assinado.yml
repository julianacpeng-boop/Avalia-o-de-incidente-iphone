name: Gerar IPA iPhone 6 Plus - não assinado

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar-ipa:
    runs-on: macos-14
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      - name: Selecionar Xcode compatível com iOS 12
        shell: bash
        run: |
          if [ -d /Applications/Xcode_15.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d /Applications/Xcode_15.3.app ]; then
            sudo xcode-select -s /Applications/Xcode_15.3.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Instalar Cordova e dependências
        run: |
          npm install -g cordova@12.0.0
          npm install

      - name: Preparar leitor de QR Code local
        shell: bash
        run: |
          mkdir -p www/js
          QR_FILE=$(find node_modules/html5-qrcode -name 'html5-qrcode.min.js' -type f | head -n 1)
          test -n "$QR_FILE"
          cp "$QR_FILE" www/js/html5-qrcode.min.js

      - name: Preparar projeto iOS 12
        shell: bash
        run: |
          rm -rf platforms plugins
          cordova platform add ios@7.1.1
          cordova prepare ios

      - name: Gerar aplicativo sem assinatura
        shell: bash
        run: |
          cordova build ios --device --debug \
            --buildFlag="IPHONEOS_DEPLOYMENT_TARGET=12.0" \
            --buildFlag="CODE_SIGNING_ALLOWED=NO" \
            --buildFlag="CODE_SIGNING_REQUIRED=NO" \
            --buildFlag="CODE_SIGN_IDENTITY="

      - name: Montar arquivo IPA
        shell: bash
        run: |
          APP_PATH=$(find platforms/ios -type d -name '*.app' -path '*Debug-iphoneos*' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find platforms/ios -type d -name '*.app' | head -n 1)
          fi
          test -n "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload saida
          cp -R "$APP_PATH" Payload/ChamadoRapidoEC.app
          ditto -c -k --sequesterRsrc --keepParent Payload \
            saida/Chamado_Rapido_EC_iPhone6Plus_NAO_ASSINADO.ipa
          ls -lh saida/Chamado_Rapido_EC_iPhone6Plus_NAO_ASSINADO.ipa

      - name: Salvar IPA na pasta saida
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f saida/Chamado_Rapido_EC_iPhone6Plus_NAO_ASSINADO.ipa
          git diff --cached --quiet || git commit -m "Atualizar IPA não assinado do iPhone 6 Plus"
          git push

      - name: Publicar IPA como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Chamado-Rapido-EC-iPhone6Plus-NAO-ASSINADO
          path: saida/Chamado_Rapido_EC_iPhone6Plus_NAO_ASSINADO.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
